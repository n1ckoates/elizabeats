[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
elizabeats-core = { path = "crates/core" }
elizabeats-audio = { path = "crates/audio" }
elizabeats-youtube = { path = "crates/youtube" }
elizabeats-library = { path = "crates/library" }
elizabeats-store = { path = "crates/store" }
elizabeats-botguard = { path = "crates/botguard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
tracing = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Optimize for size: ~3.3 MiB smaller than opt-level 3. Audio decoding +
# resampling still runs at ~145x real time (vs ~167x); measure with the
# `decode_speed` benchmark in crates/audio before changing this.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Keep dependencies fast in debug builds so audio decoding is usable while developing.
[profile.dev.package."*"]
opt-level = 2
