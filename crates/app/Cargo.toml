[package]
name = "elizabeats"
description = "DJ-operated radio playout"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "elizabeats"
path = "src/main.rs"

[dependencies]
elizabeats-core.workspace = true
elizabeats-audio.workspace = true
elizabeats-botguard.workspace = true
elizabeats-library.workspace = true
elizabeats-store.workspace = true
elizabeats-youtube.workspace = true
gpui-kit = "0.7.1"
tokio.workspace = true
futures = "0.3"
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "default-tls",
] }
# Installs and updates the app from GitHub releases (see src/updates.rs). Keep
# in step with the `vpk` version in .github/workflows/package.yml.
velopack = "=1.2.161"

# Embeds the app icon into elizabeats.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
