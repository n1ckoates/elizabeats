[package]
name = "elizabeats"
description = "DJ-operated radio playout"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "elizabeats"
path = "src/main.rs"

[dependencies]
elizabeats-core.workspace = true
elizabeats-audio.workspace = true
elizabeats-botguard.workspace = true
elizabeats-library.workspace = true
elizabeats-store.workspace = true
elizabeats-youtube.workspace = true
gpui-kit = "0.7.1"
tokio.workspace = true
futures = "0.3"
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "default-tls",
] }

# Embeds the app icon into elizabeats.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

# Installers and app bundles, built with cargo-packager on each OS from an
# already-built release binary (`cargo build --release -p elizabeats`):
#   cargo packager -p elizabeats --release --formats app,dmg   (macOS, after
#                                     scripts/compile-macos-icon.sh)
#   cargo packager -p elizabeats --release --formats nsis      (Windows)
#   cargo packager -p elizabeats --release --formats deb       (Linux)
# For an Intel Mac build from Apple Silicon, pass `--target x86_64-apple-darwin`
# to both commands. Paths are relative to this file.
[package.metadata.packager]
product-name = "Elizabeats"
identifier = "com.nickoates.elizabeats"
# Shown in the Windows installer and Settings → Apps; also part of the registry
# key the installer uses to find an earlier install, so keep it stable.
publisher = "Nick Oates"
description = "DJ-operated radio playout"
category = "Music"
binaries = [{ path = "elizabeats", main = true }]
icons = ["../../assets/icon.icns", "../../assets/icon.png"]
# The compiled Icon Composer icon (macOS only; see scripts/compile-macos-icon.sh).
# Elsewhere the file doesn't exist and nothing is copied.
resources = ["../../target/macos-icon/Assets.car"]
out-dir = "../../target/packages"

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Adds CFBundleIconName, which points macOS 26+ at Assets.car.
info-plist-path = "macos/Info.plist"

[package.metadata.packager.nsis]
installer-icon = "../../assets/icon.ico"

[package.metadata.packager.deb]
section = "sound"
# Runtime libraries (`a | b`: the package was renamed in Ubuntu 24.04).
depends = [
    "libwebkit2gtk-4.1-0",
    "libgtk-3-0t64 | libgtk-3-0",
    "libasound2t64 | libasound2",
    "libssl3t64 | libssl3",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libfontconfig1",
    "libfreetype6",
    "libvulkan1",
]
