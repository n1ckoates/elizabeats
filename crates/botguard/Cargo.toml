[package]
name = "elizabeats-botguard"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
# The webview helper process (PO-token minting and youtubei.js in WKWebView /
# WebView2 / WebKitGTK). Only the OS webview backend; no devtools, drag & drop, etc.
# On Linux this links WebKitGTK 4.1 (see README.md).
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

# Stand-in for the app executable in tests: runs the real webview helper
# (like the app's main) or, with --fake-minter, a scripted fake helper.
[[bin]]
name = "elizabeats-botguard-helper"
path = "src/bin/helper.rs"
test = false
doc = false

[lints]
workspace = true
