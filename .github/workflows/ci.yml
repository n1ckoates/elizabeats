name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is the same everywhere and needs no build, so it runs once.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - run: cargo fmt --all --check

  # Lints and tests run per OS: they only see code compiled for that OS.
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.name }}

      - name: Lints
        run: cargo lint
      - name: Tests
        run: cargo test --workspace

  package:
    name: Package (${{ matrix.name }})
    needs: [format, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel build is cross-built on the Apple Silicon runner.
          - { name: macOS Apple Silicon, os: macos-latest, formats: "app,dmg", files: "target/packages/*.dmg" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, formats: "app,dmg", files: "target/packages/*.dmg" }
          - { name: Windows, os: windows-latest, formats: nsis, files: "target/packages/*-setup.exe" }
          # The oldest supported Ubuntu, so the .deb runs on it and newer.
          - { name: Linux, os: ubuntu-22.04, formats: deb, files: "target/packages/*.deb" }
    runs-on: ${{ matrix.os }}
    env:
      # Set only for a cross build (the steps add `--target` when it is).
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.name }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Add the build target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release -p elizabeats ${TARGET:+--target "$TARGET"}
      # The Liquid Glass app icon for macOS 26+ (packaging copies it in).
      - name: Compile the macOS icon
        if: runner.os == 'macOS'
        run: scripts/compile-macos-icon.sh
      - name: Package
        shell: bash
        run: cargo packager -p elizabeats --release ${TARGET:+--target "$TARGET"} --formats "${{ matrix.formats }}"

      # Uploads the installer itself (not zipped), named after the file,
      # e.g. Elizabeats_0.1.0_x64.dmg.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.files }}
          archive: false
          if-no-files-found: error

      # Windows also gets the app as a single portable .exe (no installer).
      - name: Name the portable Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "elizabeats") | .version')
          cp target/release/elizabeats.exe "target/packages/Elizabeats_${version}_x64-portable.exe"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          path: target/packages/*-portable.exe
          archive: false
          if-no-files-found: error
