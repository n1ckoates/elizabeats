name: CI

# Changes that only touch the website (web/, deployed by Vercel) skip this.
on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Test builds (1.0.0-dev.<run>), alongside the checks for speed. A run can
  # have downloads even if a check failed, so only use them from green runs.
  package:
    uses: ./.github/workflows/package.yml
