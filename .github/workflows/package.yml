name: Package

# Dev builds (1.0.2-dev.<run>) don't update themselves, and are attached to
# the run for testing. Stable builds are handed to ci.yml's release job, and
# their downloads keep the same names every release so links to
# releases/latest/download/<name> stay valid.
on:
  workflow_call:
    inputs:
      stable:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Must match the velopack crate version in crates/app/Cargo.toml.
  VPK_VERSION: 1.2.161

jobs:
  package:
    name: ${{ inputs.stable && 'Stable' || 'Dev' }} build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            slug: macos-arm64
            os: macos-latest
            installer: target/dist/*-Setup.pkg
            portable: target/dist/*-Portable.zip
          - name: macOS Intel
            slug: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            installer: target/dist/*-Setup.pkg
            portable: target/dist/*-Portable.zip
          - name: Windows
            slug: windows
            os: windows-latest
            installer: target/dist/*-Setup.exe
            portable: target/dist/*-Portable.zip
          # The oldest supported Ubuntu, so the AppImage also runs on newer ones.
          - name: Linux
            slug: linux
            os: ubuntu-22.04
            installer: target/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ELIZABEATS_RELEASE: ${{ inputs.stable && '1' || '' }}
      # Dev builds skip release's size optimizations, which are slow to build.
      PROFILE: ${{ inputs.stable && 'release' || 'dev-build' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.name }}-${{ env.PROFILE }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}

      - name: Version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "elizabeats") | .version')
          if [[ "$ELIZABEATS_RELEASE" != 1 ]]; then
            version="$version-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: cargo build --profile "$PROFILE" -p elizabeats ${TARGET:+--target "$TARGET"}
      - if: runner.os == 'macOS'
        run: scripts/compile-macos-icon.sh
      - name: Package
        shell: bash
        env:
          VELOPACK_DELTAS: ${{ inputs.stable && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh "$VERSION" ${TARGET:+"$TARGET"}
      - if: runner.os == 'Windows'
        shell: bash
        run: scripts/package-msix.sh "$VERSION"

      # Unzipped, so each download keeps its own file name.
      - if: ${{ !inputs.stable }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.installer }}
          archive: false
          if-no-files-found: error
      - if: ${{ !inputs.stable && matrix.portable }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.portable }}
          archive: false
          if-no-files-found: error
      # Stable too: the one to submit to the Microsoft Store.
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: target/packages/*.msix
          archive: false
          if-no-files-found: error
      - if: ${{ inputs.stable }}
        uses: actions/upload-artifact@v7
        with:
          name: stable-${{ matrix.slug }}
          path: target/dist/*
          retention-days: 3
          if-no-files-found: error
