name: Set up build tools
description: Rust, Node + pnpm (for the BotGuard JS bundle), and per-OS system libraries.

inputs:
  cache-key:
    description: Separates the Rust cache of jobs that would otherwise share one (e.g. the two macOS builds).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwebkit2gtk-4.1-dev libgtk-3-dev \
          libasound2-dev libssl-dev \
          libfontconfig-dev libfreetype-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev

    # gpui compiles Metal shaders at build time, and newer Xcode versions
    # don't include the Metal compiler.
    - name: Install the Metal shader compiler
      if: runner.os == 'macOS'
      shell: bash
      run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

    # No install here: crates/botguard/build.rs runs `pnpm install` itself.
    - uses: pnpm/setup@v3
      with:
        version: 12
        runtime: node@26
        install: false
        cache: true
        cache-dependency-path: crates/botguard/js/pnpm-lock.yaml

    - name: Install Rust
      shell: bash
      run: rustup toolchain install

    # Saved even when a job fails, so the compile work isn't lost. If a cache
    # ever seems stuck half-built, bump `prefix-key` to start fresh.
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
